# =============================================================================
# MT5 口座リスト
# =============================================================================
# 形式:  口座名|ポート番号|.envファイルパス
# 先頭が # の行はコメントとして無視される。
#
# 新しい口座を追加するには:
#   1. .env.account.example をコピーして .env.<口座名> を作成（値を記入）
#   2. 下に 口座名|ポート|.env.<口座名> の行を追加
#   3. .env の MT5_ACCOUNTS にも口座名:localhost:ポート を追記
#   4. start-relays.bat を実行
# =============================================================================

# ICMarkets|5580|.env.icmarkets   # .env.icmarkets未作成 → 追加時に有効化
